name: Publish lab PDFs

# Two ways in:
#   - publishing a release by hand: build and attach the PDFs to *that* release;
#   - manual dispatch: bump the patch of the highest version tag and create a
#     release for it.
on:
  release:
    types: [published]
  workflow_dispatch:

# Two runs at once would compute the same next version.
concurrency: publish

jobs:
  convert-markdown-to-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Build PDFs
      run: make

    - name: Attach PDFs to the published release
      if: github.event_name == 'release'
      run: gh release upload "${{ github.event.release.tag_name }}" build/*.pdf --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create the next release
      if: github.event_name == 'workflow_dispatch'
      run: |
        # Highest x.y.z tag by version order; `git describe` picked the most recently
        # committed tag instead, and choked on non-version tags such as `alpha`.
        latest=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
        if [ -z "$latest" ]; then
          version="0.1.0"
        else
          IFS='.' read -r major minor patch <<< "$latest"
          version="$major.$minor.$((patch + 1))"
        fi
        echo "Latest tag: ${latest:-<none>}, new version: $version"
        # The tag is created with the release, after a successful build, so a failed
        # build no longer leaves an orphan tag behind.
        gh release create "$version" build/*.pdf \
          --target "$GITHUB_SHA" \
          --title "$version" \
          --notes "Εργαστηριακό υλικό — έκδοση $version"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
