name: Publish lab PDFs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  convert-markdown-to-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Get latest tag
      id: get_tag
      run: |
        latest_tag=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || true)
        echo "Latest tag: ${latest_tag:-<none>}"
        echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

    - name: Calculate new version
      id: new_version
      run: |
        latest_version="${{ steps.get_tag.outputs.tag }}"
        if [ -z "$latest_version" ]; then
          new_version="0.1.0"
        else
          IFS='.' read -r major minor patch <<< "$latest_version"
          patch=$((patch + 1))
          new_version="$major.$minor.$patch"
        fi
        echo "New version: $new_version"
        echo "version=$new_version" >> "$GITHUB_OUTPUT"

    - name: Create new tag
      run: |
        git tag "${{ steps.new_version.outputs.version }}"
        git push origin "${{ steps.new_version.outputs.version }}"

    - name: Build PDFs
      run: make

    - name: Upload PDFs to GitHub Releases
      run: |
        tag_name="${{ steps.new_version.outputs.version }}"
        gh release create "$tag_name" build/*.pdf \
          --title "$tag_name" \
          --notes "Εργαστηριακό υλικό — έκδοση $tag_name"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
